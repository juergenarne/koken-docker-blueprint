# Koken calls its own API via HTTP ("loopback" requests). Behind a Docker port
# mapping (e.g. host 8080 -> container 80) SERVER_PORT must be the port Apache
# really listens on, not the one from the browser's Host header – otherwise
# these internal requests go to a port that does not exist in the container.
UseCanonicalName On
UseCanonicalPhysicalPort On
ServerName localhost

# Don't advertise versions
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    AllowOverride All
</Directory>
