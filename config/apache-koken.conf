# Host name and port for URLs Apache builds itself (e.g. the redirect /admin -> /admin/)
# come from the request's Host header – behind a reverse proxy that is the real domain.
UseCanonicalName Off
# A Host header without a port (reverse proxy) means the port Apache really listens on.
UseCanonicalPhysicalPort On
ServerName localhost

# Koken calls its own API via HTTP using the Host header of the current request.
# For direct access through a Docker port mapping (e.g. http://localhost:8080) the
# entrypoint additionally lets Apache listen on that port inside the container
# (KOKEN_PUBLIC_PORT), so these internal requests reach it.

# Don't advertise versions
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    AllowOverride All
</Directory>
