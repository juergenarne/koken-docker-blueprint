services:
  web:
    build:
      context: .
      args:
        INSTALL_FFMPEG: ${INSTALL_FFMPEG:-false}
    image: ${APP_NAME:-koken}-web
    restart: always
    container_name: ${APP_NAME:-koken}-apache
    volumes:
      - ./${APACHE_HTDOCS:-src/htdocs}:/var/www/html
      - ./config/php.ini:/usr/local/etc/php/conf.d/zz-koken.ini:ro
    ports:
      - "${APACHE_PORT:-8080}:80"
    networks:
      - koken-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # Used by the web installer (src/htdocs/install/) to prefill the database step
      KOKEN_DB_HOST: db
      KOKEN_DB_NAME: ${MYSQL_DATABASE}
      KOKEN_DB_USER: ${MYSQL_USER}
      KOKEN_DB_PASSWORD: ${MYSQL_PASSWORD}
      KOKEN_DB_PREFIX: ${KOKEN_DB_PREFIX:-koken_}
      # Protects the web installer until Koken is installed (generated by setup.sh)
      KOKEN_INSTALL_TOKEN: ${KOKEN_INSTALL_TOKEN:-}

  db:
    image: mariadb:${MARIADB_VERSION:-11.8}
    restart: always
    container_name: ${APP_NAME:-koken}-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${MARIADB_LOCAL_DIR:-./mariadb/data}${MARIADB_DATA_DIR:-/lib}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - koken-network
    # Not published on the host. To connect from the host (GUI tool, backups),
    # see "Database access from the host" in README.md.

networks:
  koken-network:
    driver: bridge
